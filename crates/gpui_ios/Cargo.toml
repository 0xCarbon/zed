[package]
name = "gpui_ios"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
autoexamples = false

[lints]
workspace = true

[lib]
path = "src/gpui_ios.rs"

[dependencies]
gpui.workspace = true

[target.'cfg(target_os = "ios")'.dependencies]
anyhow.workspace = true
async-task = "4.7"
dispatch2 = "0.3.1"
futures.workspace = true
gpui_wgpu.workspace = true
log.workspace = true
objc2.workspace = true
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFCGTypes",
] }
objc2-foundation = { workspace = true, features = [
    "NSArray",
    "NSEnumerator",
    "NSSet",
    "NSString",
    "NSThread",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-metal",
    "CALayer",
    "CAMetalLayer",
] }
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "UIApplication",
    "UIDevice",
    "UIEvent",
    "UIResponder",
    "UIScreen",
    "UITouch",
    "UIView",
    "UIViewController",
    "UIWindow",
] }
raw-window-handle = "0.6"
uuid.workspace = true
